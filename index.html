<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">CLAUDE TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
        <div class="panel-section records">
          <span class="label">RECORDS</span>
          <div id="records-panel"></div>
          <button id="reset-records-btn" type="button">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <form id="name-entry" class="name-entry hidden">
          <label for="name-input">¡Nuevo récord! Tu nombre:</label>
          <input id="name-input" type="text" maxlength="12" autocomplete="off" />
          <button type="submit" id="save-name-btn">Guardar</button>
        </form>
        <div id="overlay-records" class="overlay-records"></div>
        <button id="restart-btn">Reiniciar</button>
        <div id="pause-menu" class="pause-menu">
          <button id="pm-resume" type="button">Reanudar</button>
          <button id="pm-restart" type="button">Reiniciar</button>
          <button id="pm-controls" type="button" aria-expanded="false">Ver controles</button>
          <ul id="pm-controls-list" class="pm-controls-list" hidden>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <label class="pm-level">Nivel inicial
            <select id="pm-start-level"></select>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
  <script src="pause-menu.js"></script>
</body>
</html>
